name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jobtracker_test
          POSTGRES_PASSWORD: jobtracker_test
          POSTGRES_DB: jobtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobtracker_test -d jobtracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore JobTracker.sln

      - name: Check formatting
        run: dotnet format JobTracker.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build JobTracker.sln --no-restore --configuration Release

      - name: Test
        env:
          JOBTRACKER_TEST_POSTGRES: Host=localhost;Port=5432;Database=jobtracker_test;Username=jobtracker_test;Password=jobtracker_test
          JOBTRACKER_REQUIRE_POSTGRES_TESTS: "true"
        run: dotnet test JobTracker.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Check coverage
        run: |
          file=$(find coverage -name coverage.cobertura.xml | head -n 1)
          rate=$(grep -o -m 1 'line-rate="[0-9.]*"' "$file" | head -n 1 | cut -d '"' -f 2)
          percent=$(awk "BEGIN { printf \"%.1f\", $rate * 100 }")
          echo "Line coverage: $percent%" | tee -a "$GITHUB_STEP_SUMMARY"
          if awk "BEGIN { exit !($rate < 0.8) }"; then
            echo "Coverage is below 80%."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JobTracker.Web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: JobTracker.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
